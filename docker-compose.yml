services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: uptime
      MARIADB_USER: uptime
      MARIADB_PASSWORD: uptime
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: uptime
      DATABASE_USER: uptime
      DATABASE_PASSWORD: uptime
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
