{% extends "admin/base.html" %}
{% block content %}
  <h2>アプリ設定</h2>
  <form method="post" action="/admin/settings">
    <label>サイトタイトル</label>
    <input type="text" name="site_title" value="{{ settings.site_title }}">

    <label>PageSpeed Insights APIキー</label>
    <input type="text" name="pagespeed_api_key" value="{{ settings.pagespeed_api_key }}" placeholder="未設定の場合はPageSpeed計測をスキップします">

    <h3>メール通知 (SMTP)</h3>
    <label>SMTPホスト</label>
    <input type="text" name="smtp_host" value="{{ settings.smtp_host }}">
    <label>SMTPポート</label>
    <input type="number" name="smtp_port" value="{{ settings.smtp_port }}">
    <label>SMTPユーザー名</label>
    <input type="text" name="smtp_username" value="{{ settings.smtp_username }}">
    <label>SMTPパスワード</label>
    <input type="password" name="smtp_password" value="{{ settings.smtp_password }}">
    <label>送信元アドレス</label>
    <input type="email" name="smtp_from_address" value="{{ settings.smtp_from_address }}">
    <div class="checkbox-row"><input type="checkbox" name="smtp_use_tls" {{ 'checked' if settings.smtp_use_tls }}><label>STARTTLSを使う</label></div>

    <button class="btn" type="submit">保存</button>
  </form>

  <div class="card" style="margin-top: 1.5rem;">
    <h3>パスワード変更 ({{ username }})</h3>
    {% if password_error %}<p class="error">{{ password_error }}</p>{% endif %}
    {% if password_ok %}<p style="color: var(--up);">パスワードを変更しました。</p>{% endif %}
    <form method="post" action="/admin/settings/password">
      <label>新しいパスワード(8文字以上)</label>
      <input type="password" name="new_password" required minlength="8">
      <label>新しいパスワード(確認)</label>
      <input type="password" name="confirm_password" required minlength="8">
      <button class="btn" type="submit">パスワードを変更</button>
    </form>
  </div>
{% endblock %}
