<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初期セットアップ - {{ site_title }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main style="max-width: 420px; margin-top: 3rem;">
    <div class="card">
      <h2>初期セットアップ</h2>
      <p style="color: var(--muted); font-size: 0.85rem;">
        データベース(MySQL/MariaDB)への接続情報を入力してください。接続に成功すると自動でテーブルが作成され、管理者アカウントが生成されます(ユーザー名・パスワードは起動ログに表示されます)。
      </p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/setup">
        <label>ホスト</label>
        <input type="text" name="host" value="{{ form.host or '' }}" placeholder="127.0.0.1" required>
        <label>ポート</label>
        <input type="number" name="port" value="{{ form.port or 3306 }}" required>
        <label>データベース名</label>
        <input type="text" name="name" value="{{ form.name or '' }}" placeholder="uptime" required>
        <label>ユーザー名</label>
        <input type="text" name="user" value="{{ form.user or '' }}" required>
        <label>パスワード</label>
        <input type="password" name="password" value="">
        <button class="btn" type="submit">接続してセットアップ</button>
      </form>
    </div>
  </main>
</body>
</html>
